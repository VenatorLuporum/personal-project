<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microblog | My Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout" style="display: block; max-width: 700px;"> <!-- Centers the feed -->
        
        <header class="site-header" style="text-align: left; margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1>💬 Microblog</h1>
                <p class="tagline">All my thoughts in one place.</p>
            </div>
            <!-- Back button -->
            <a href="index.html" class="btn btn-primary" style="text-decoration: none; padding: 0.5rem 1rem;">← Back</a>
        </header>

        <main>
            <section class="card" id="microblog">
                
                <!-- The Composer -->
                <form id="post-form" class="composer">
                    <div class="composer-avatar" aria-hidden="true">You</div>
                    <div class="composer-body">
                        <textarea id="post-input" rows="1" placeholder="What's happening?" maxlength="280" required></textarea>
                        <div class="composer-footer">
                            <span id="char-count" class="char-count">0 / 280</span>
                            <button type="submit" class="btn btn-primary" id="post-btn" disabled>Post</button>
                        </div>
                    </div>
                </form>

                <!-- The Feed -->
                <div id="posts-container">
                    <p class="empty-state">Loading posts from the cloud...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Floating Dark Mode Button -->
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode">🌙 Dark Mode</button>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="microblog.js"></script>
</body>
</html>
